name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      # Windows runners check out CRLF by default, which breaks byte-exact
      # fixtures and the bundle-drift gate. Belt and braces with .gitattributes.
      - name: Force LF checkouts
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Test
        run: npm test

  bundles:
    name: bundle drift
    runs-on: ubuntu-latest
    steps:
      - name: Force LF checkouts
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # The committed bundles must be exactly what this source builds. esbuild
      # is exact-pinned and the lockfile is committed, so any diff here means
      # someone edited src/ without rebuilding.
      - name: Rebuild and compare
        run: |
          npm run build
          git diff --exit-code -- dist/ THIRD-PARTY-NOTICES.md
